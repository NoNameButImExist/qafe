packages:
  - apps/*
  - packages/*

# Build skripte smiju pokretati samo ovi paketi (pnpm ih inače blokira).
allowBuilds:
  '@swc/core': true
  cpu-features: false
  esbuild: false
  # Optional native speed-up for BullMQ's msgpack; prebuilt binaries are used without it.
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false

# pnpm po defaultu odbija verzije objavljene prije manje od minimumReleaseAge
# (zaštita lanca snabdijevanja). Ove su dodane svjesno; izbriši ih kad ostare.
minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.2'
  - '@nestjs/core@12.1.2'
  - '@nestjs/platform-fastify@12.1.2'
  - '@nestjs/platform-socket.io@12.1.2'
  - '@nestjs/testing@12.1.2'
  - '@nestjs/websockets@12.1.2'
  - lucide-react@1.49.0
