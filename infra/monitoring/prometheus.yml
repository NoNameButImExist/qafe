# Metrics store. Retention is set on the command line (docker-compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # api and worker (OpenTelemetry, through the collector)
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
  # Requests per app as Traefik sees them (status codes, durations)
  - job_name: traefik
    static_configs:
      - targets: ['traefik:8082']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
