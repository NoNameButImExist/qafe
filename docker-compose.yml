# Base definition of the whole stack: data services, migrations, api, worker, the four
# frontends and Traefik in front of them.
#
#   docker compose --profile infra up -d     data services only (Postgres, Redis, MinIO) for `pnpm dev`
#   docker compose --profile app up -d       everything (the Makefile wraps this: `make up`)
#
# docker-compose.override.yml (dev) is loaded automatically: host ports, http without TLS.
# docker-compose.prod.yml replaces it on a server: images from GHCR, HTTPS, restarts.
#
# Routing (Traefik, tenant from the host):
#   <slug>.DOMAIN            guest app          <any host>/api/*  api (without /api)
#   staff.DOMAIN             staff app          panel.DOMAIN      venue panel
#   admin.DOMAIN             platform admin     s3.DOMAIN         menu images (MinIO)
#   DOMAIN, www.DOMAIN       public landing page (apps/web)
#   grafana.DOMAIN           monitoring (profile monitoring)
#
# Profile monitoring: otel-collector, prometheus, loki, alloy, grafana (`make up` includes it).
# The backup service (profile app) dumps the database every night into S3 (MinIO locally).
#
# Images are <QAFE_IMAGE_PREFIX>-<app>:<tag>; locally qafe-api:local etc. (built here).

name: qafe

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Shared by api and worker: everything comes from .env, the addresses are the containers'.
x-backend-env: &backend-env
  NODE_ENV: production
  POSTGRES_HOST: postgres
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  # Admin monitoring screen (FR-ADM-17): read from Prometheus (profile monitoring).
  PROMETHEUS_URL: http://prometheus:9090
  GRAFANA_URL: http://grafana.${DOMAIN:-qafe.localhost}
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  # Metrics to the collector (profile monitoring); without it they are simply not sent.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

x-web: &web
  profiles: [app]
  restart: unless-stopped
  networks: [internal]
  logging: *logging

# pgBackRest repository settings, shared by postgres (WAL archiving) and pitr (backups).
x-pitr-env: &pitr-env
  PITR_PASSPHRASE: ${PITR_PASSPHRASE:?Set PITR_PASSPHRASE in .env}
  PITR_REPO_TYPE: ${PITR_REPO_TYPE:-posix}
  PITR_RETENTION_FULL: ${PITR_RETENTION_FULL:-2}
  PITR_S3_BUCKET: ${PITR_S3_BUCKET:-}
  PITR_S3_ENDPOINT: ${PITR_S3_ENDPOINT:-}
  PITR_S3_REGION: ${PITR_S3_REGION:-}
  PITR_S3_KEY: ${PITR_S3_KEY:-}
  PITR_S3_SECRET: ${PITR_S3_SECRET:-}

services:
  # ---------------------------------------------------------------- data services
  postgres:
    # Postgres 16 + pgBackRest: every WAL segment goes to the PITR repository (NFR-24).
    image: ${QAFE_IMAGE_PREFIX:-qafe}-postgres:${POSTGRES_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/postgres.Dockerfile
    profiles: [infra, app]
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=qafe archive-push %p
      # Even when quiet, at most this many seconds of changes wait for the archive.
      - -c
      - archive_timeout=${PITR_ARCHIVE_TIMEOUT:-60}
      # Query statistics for finding slow queries (pg_stat_statements view, small overhead).
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
    environment:
      <<: *pitr-env
      POSTGRES_DB: ${POSTGRES_DB:-qafe}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-qafe_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      SVC_CORE_PASSWORD: ${SVC_CORE_PASSWORD:?Set SVC_CORE_PASSWORD in .env}
      SVC_CATALOG_PASSWORD: ${SVC_CATALOG_PASSWORD:?Set SVC_CATALOG_PASSWORD in .env}
      SVC_ORDERING_PASSWORD: ${SVC_ORDERING_PASSWORD:?Set SVC_ORDERING_PASSWORD in .env}
      SVC_BILLING_PASSWORD: ${SVC_BILLING_PASSWORD:?Set SVC_BILLING_PASSWORD in .env}
      SVC_AUDIT_PASSWORD: ${SVC_AUDIT_PASSWORD:?Set SVC_AUDIT_PASSWORD in .env}
      SVC_REPORTING_PASSWORD: ${SVC_REPORTING_PASSWORD:?Set SVC_REPORTING_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgbackrest:/var/lib/pgbackrest
      - pgsocket:/var/run/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    logging: *logging

  # Cache, rate limits, realtime fan-out and the worker's job queue. Never a source of truth:
  # losing it loses no data. volatile-lru: under memory pressure only keys with an expiry
  # (cache, limits) are evicted, never the job queue (BullMQ keys have none).
  redis:
    image: redis:8.6-alpine
    profiles: [infra, app]
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    logging: *logging

  # S3-compatible storage for menu images and logos. The minio/minio image is no longer
  # published on Docker Hub; Chainguard builds MinIO from source (only :latest is free).
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: [infra, app]
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      # No curl, wget or grep in the image: plain HTTP over bash's /dev/tcp.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      # Browsers load menu images from s3.DOMAIN (read-only bucket policy, see minio-policy).
      traefik.enable: 'true'
      traefik.http.routers.s3.rule: Host(`s3.${DOMAIN:-qafe.localhost}`)
      traefik.http.routers.s3.entrypoints: web
      traefik.http.services.s3.loadbalancer.server.port: '9000'
    networks: [internal]
    logging: *logging

  # One-off: creates the bucket (the client image has no shell, so one command per service).
  minio-bucket:
    image: cgr.dev/chainguard/minio-client:latest
    profiles: [infra, app]
    command: ['mb', '--ignore-existing', 'qafe/${S3_BUCKET_MENU_IMAGES:-menu-images}']
    environment:
      MC_HOST_qafe: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    networks: [internal]

  # One-off: the private bucket for database backups.
  minio-backups-bucket:
    image: cgr.dev/chainguard/minio-client:latest
    profiles: [infra, app]
    command: ['mb', '--ignore-existing', 'qafe/${BACKUP_BUCKET:-backups}']
    environment:
      MC_HOST_qafe: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    networks: [internal]

  # One-off: anyone may read images (keys are random UUIDs); only the API writes.
  minio-policy:
    image: cgr.dev/chainguard/minio-client:latest
    profiles: [infra, app]
    command: ['anonymous', 'set', 'download', 'qafe/${S3_BUCKET_MENU_IMAGES:-menu-images}']
    environment:
      MC_HOST_qafe: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
    depends_on:
      minio-bucket:
        condition: service_completed_successfully
    networks: [internal]

  # ---------------------------------------------------------------- application
  # One-off: database migrations (dbmate) before api and worker start.
  migrate:
    image: ${QAFE_IMAGE_PREFIX:-qafe}-migrate:${MIGRATE_TAG:-${QAFE_TAG:-local}}
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    profiles: [app]
    environment:
      DATABASE_URL: postgres://${POSTGRES_ADMIN_USER:-qafe_admin}:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB:-qafe}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  api:
    image: ${QAFE_IMAGE_PREFIX:-qafe}-api:${API_TAG:-${QAFE_TAG:-local}}
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { APP: api }
    profiles: [app]
    restart: unless-stopped
    env_file: .env
    # One Node process uses one CPU core: run more of them behind Traefik (state is in
    # Postgres and Redis). Each opens up to 6 x DB_POOL_MAX connections.
    deploy:
      replicas: ${API_REPLICAS:-1}
    environment:
      <<: *backend-env
      PORT: 3000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL_DOCKER:-http://s3.${DOMAIN:-qafe.localhost}/${S3_BUCKET_MENU_IMAGES:-menu-images}}
      # The browser sees /api/auth (Traefik strips /api before the api).
      AUTH_COOKIE_PATH: /api/auth
      GUEST_URL_TEMPLATE: ${GUEST_URL_TEMPLATE_DOCKER:-https://{slug}.${DOMAIN:-qafe.localhost}/t/{token}}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      # JWT keys (pnpm keys:generate); relative key paths in .env resolve under /app.
      - ./secrets:/app/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      traefik.enable: 'true'
      # Every frontend calls its own origin under /api (same-origin cookies, no CORS).
      traefik.http.routers.api.rule: HostRegexp(`^[a-z0-9-]+\.${DOMAIN:-qafe.localhost}$$`) && PathPrefix(`/api`)
      traefik.http.routers.api.priority: '100'
      traefik.http.routers.api.entrypoints: web
      traefik.http.routers.api.middlewares: strip-api
      traefik.http.middlewares.strip-api.stripprefix.prefixes: /api
      traefik.http.services.api.loadbalancer.server.port: '3000'
      # Several api processes (API_REPLICAS): a Socket.IO long-polling fallback must stay on one.
      traefik.http.services.api.loadbalancer.sticky.cookie: 'true'
      traefik.http.services.api.loadbalancer.sticky.cookie.name: qafe_lb
      traefik.http.services.api.loadbalancer.sticky.cookie.httponly: 'true'
    networks: [internal]
    logging: *logging

  worker:
    image: ${QAFE_IMAGE_PREFIX:-qafe}-worker:${WORKER_TAG:-${QAFE_TAG:-local}}
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { APP: worker }
    profiles: [app]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    logging: *logging

  guest:
    <<: *web
    image: ${QAFE_IMAGE_PREFIX:-qafe}-guest:${GUEST_TAG:-${QAFE_TAG:-local}}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { APP: guest }
    labels:
      traefik.enable: 'true'
      # Any other subdomain is a venue: lowest priority, after the app hosts below.
      traefik.http.routers.guest.rule: HostRegexp(`^[a-z0-9-]+\.${DOMAIN:-qafe.localhost}$$`)
      traefik.http.routers.guest.priority: '1'
      traefik.http.routers.guest.entrypoints: web
      traefik.http.services.guest.loadbalancer.server.port: '8080'

  staff:
    <<: *web
    image: ${QAFE_IMAGE_PREFIX:-qafe}-staff:${STAFF_TAG:-${QAFE_TAG:-local}}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { APP: staff }
    labels:
      traefik.enable: 'true'
      traefik.http.routers.staff.rule: Host(`staff.${DOMAIN:-qafe.localhost}`)
      traefik.http.routers.staff.entrypoints: web
      traefik.http.services.staff.loadbalancer.server.port: '8080'

  panel:
    <<: *web
    image: ${QAFE_IMAGE_PREFIX:-qafe}-panel:${PANEL_TAG:-${QAFE_TAG:-local}}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { APP: panel }
    labels:
      traefik.enable: 'true'
      traefik.http.routers.panel.rule: Host(`panel.${DOMAIN:-qafe.localhost}`)
      traefik.http.routers.panel.entrypoints: web
      traefik.http.services.panel.loadbalancer.server.port: '8080'

  admin:
    <<: *web
    image: ${QAFE_IMAGE_PREFIX:-qafe}-admin:${ADMIN_TAG:-${QAFE_TAG:-local}}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { APP: admin }
    labels:
      traefik.enable: 'true'
      traefik.http.routers.admin.rule: Host(`admin.${DOMAIN:-qafe.localhost}`)
      traefik.http.routers.admin.entrypoints: web
      traefik.http.services.admin.loadbalancer.server.port: '8080'

  # Public landing page for venue owners and guests.
  web:
    <<: *web
    image: ${QAFE_IMAGE_PREFIX:-qafe}-web:${WEB_TAG:-${QAFE_TAG:-local}}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { APP: web }
    labels:
      traefik.enable: 'true'
      traefik.http.routers.web.rule: Host(`${DOMAIN:-qafe.localhost}`) || Host(`www.${DOMAIN:-qafe.localhost}`)
      traefik.http.routers.web.priority: '50'
      traefik.http.routers.web.entrypoints: web
      traefik.http.services.web.loadbalancer.server.port: '8080'

  # Reverse proxy: routes by host and path, WebSockets included. Reads the labels above.
  traefik:
    image: traefik:v3.7
    profiles: [app]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=qafe_internal
      - --entrypoints.web.address=:80
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --entrypoints.metrics.address=:8082
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: [api, guest, staff, panel, admin, web]
    networks: [internal]
    logging: *logging

  # Nightly database backup: pg_dump, encrypted, to s3://BACKUP_BUCKET (daily/ and weekly/).
  # make backup (now), make backup-restore-test (restore the newest into a scratch database).
  backup:
    image: ${QAFE_IMAGE_PREFIX:-qafe}-backup:${BACKUP_TAG:-${QAFE_TAG:-local}}
    build:
      context: .
      dockerfile: infra/docker/backup.Dockerfile
    profiles: [app]
    restart: unless-stopped
    environment:
      TZ: ${BACKUP_TZ:-Europe/Sarajevo}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      PGHOST: postgres
      PGUSER: ${POSTGRES_ADMIN_USER:-qafe_admin}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-qafe}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?Set BACKUP_PASSPHRASE in .env}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-backups}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      # Audit log months older than this go to s3://BACKUP_BUCKET/audit/ (NFR-25: >= 12).
      AUDIT_RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-24}
      # MinIO here; on a server point these at an off-site S3 (Backblaze B2, Hetzner, AWS).
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      minio-backups-bucket:
        condition: service_completed_successfully
    networks: [internal]
    logging: *logging

  # Point-in-time recovery (NFR-24): daily pgBackRest backups next to the continuous WAL
  # archive. make pitr-restore-test restores "2 minutes ago" into a scratch directory.
  pitr:
    image: ${QAFE_IMAGE_PREFIX:-qafe}-postgres:${POSTGRES_IMAGE_TAG:-local}
    profiles: [app]
    restart: unless-stopped
    user: postgres
    entrypoint: ['/usr/local/bin/pitr-loop.sh']
    environment:
      <<: *pitr-env
      TZ: ${BACKUP_TZ:-Europe/Sarajevo}
      PITR_AT: ${PITR_AT:-03:00}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-qafe_admin}
      POSTGRES_DB: ${POSTGRES_DB:-qafe}
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgbackrest:/var/lib/pgbackrest
      - pgsocket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  # ---------------------------------------------------------------- monitoring
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [internal]
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    networks: [internal]
    logging: *logging

  loki:
    image: grafana/loki:3.7.1
    profiles: [monitoring]
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./infra/monitoring/loki.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    networks: [internal]
    logging: *logging

  # Ships every container's logs to Loki.
  alloy:
    image: grafana/alloy:v1.20.1
    profiles: [monitoring]
    restart: unless-stopped
    command: ['run', '/etc/alloy/config.alloy', '--storage.path=/var/lib/alloy']
    volumes:
      - ./infra/monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [internal]
    logging: *logging

  grafana:
    image: grafana/grafana:12.4.2
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/qafe-overview.json
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus, loki]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.grafana.rule: Host(`grafana.${DOMAIN:-qafe.localhost}`)
      # Above the api router (100): Grafana's own /api must not reach our api.
      traefik.http.routers.grafana.priority: '200'
      traefik.http.routers.grafana.entrypoints: web
      traefik.http.services.grafana.loadbalancer.server.port: '3000'
    networks: [internal]
    logging: *logging

networks:
  internal:

volumes:
  pgdata:
  pgbackrest:
  pgsocket:
  miniodata:
  prometheusdata:
  lokidata:
  grafanadata:
