name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Only packages changed since this commit (and packages depending on them) are checked.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  TURBO_SCM_HEAD: ${{ github.sha }}
  # release-please's PR only bumps versions and changelogs of every package it releases. Checking
  # and building all of them again is waste: the code was checked in its own PR, and the Release
  # workflow builds and publishes the released images when this PR is merged.
  RELEASE_PR: ${{ startsWith(github.head_ref, 'release-please--') }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm format:check

      - name: Check affected packages
        if: env.RELEASE_PR != 'true'
        run: |
          if [[ -z "$TURBO_SCM_BASE" || "$TURBO_SCM_BASE" =~ ^0+$ ]]; then
            pnpm turbo run lint typecheck test build
          else
            pnpm turbo run lint typecheck test build --affected
          fi

      - name: Affected Docker images
        id: images
        run: |
          if [[ "$RELEASE_PR" == 'true' ]]; then
            echo 'images=[]' >> "$GITHUB_OUTPUT"
          else
            node .github/scripts/image-matrix.mjs affected >> "$GITHUB_OUTPUT"
          fi

      # What this run checked, on the run's summary page: only changed packages and the
      # packages that depend on them (a change in contracts or ui reaches every app using it).
      - name: Summary
        if: always()
        run: |
          {
            echo "### Checked packages"
            if [[ "$RELEASE_PR" == 'true' ]]; then
              echo "None: release PR (versions and changelogs only)."
            elif [[ -z "$TURBO_SCM_BASE" || "$TURBO_SCM_BASE" =~ ^0+$ ]]; then
              echo "All packages (no base commit to compare with)."
            else
              pnpm --silent turbo ls --affected --output=json \
                | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); const p=d.packages.items.map(i=>i.name); console.log(p.length ? p.map(n=>"- `"+n+"`").join("\n") : "None: no package changed.")'
            fi
            echo
            echo "### Docker images to build"
            echo '${{ steps.images.outputs.images }}' \
              | node -e 'const i=JSON.parse(require("fs").readFileSync(0,"utf8")||"[]"); console.log(i.length ? i.map(x=>"- `qafe-"+x.app+"`").join("\n") : "None.")'
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration tests (Postgres, RLS)
    # NFR-09: venue isolation is tested against a real Postgres on every PR (Testcontainers).
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: |
          if [[ -z "$TURBO_SCM_BASE" || "$TURBO_SCM_BASE" =~ ^0+$ ]]; then
            pnpm turbo run test:integration
          else
            pnpm turbo run test:integration --affected
          fi

  docker:
    name: Docker build (${{ matrix.app }})
    needs: verify
    # On main the Release workflow builds and pushes released images; PRs only check that they build.
    if: github.event_name == 'pull_request' && needs.verify.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.verify.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP=${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
